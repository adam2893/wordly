name: Build and publish Docker image

on:
  push:
    branches: [main]
    # Pushing a version tag (v1.0.0) publishes versioned images too.
    tags: ["v*.*.*"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: wordly:smoketest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -e
          docker run -d --name wordly-smoketest -p 8080:80 wordly:smoketest
          echo "Waiting for server to come up..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "Server is up"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Server never became healthy"
              docker logs wordly-smoketest
              exit 1
            fi
            sleep 1
          done

          echo "Checking static frontend is served..."
          curl -sf http://localhost:8080/ | grep -q "WORDLY" || (echo "index.html missing expected content" && exit 1)
          curl -sf http://localhost:8080/ | grep -q "Spelly Bee" || (echo "game menu missing Spelly Bee" && exit 1)
          curl -sf http://localhost:8080/wordly | grep -q "wordly.js" || (echo "/wordly page missing" && exit 1)
          curl -sf http://localhost:8080/bee | grep -q "bee.js" || (echo "/bee page missing" && exit 1)
          curl -sf http://localhost:8080/boxed | grep -q "boxed.js" || (echo "/boxed page missing" && exit 1)
          curl -sf http://localhost:8080/connections | grep -q "connections.js" || (echo "/connections page missing" && exit 1)
          curl -sf http://localhost:8080/mini | grep -q "crossword.js" || (echo "/mini page missing" && exit 1)
          curl -sf http://localhost:8080/crossword | grep -q "crossword.js" || (echo "/crossword page missing" && exit 1)
          curl -sf http://localhost:8080/tiles | grep -q "tiles.js" || (echo "/tiles page missing" && exit 1)
          curl -sf http://localhost:8080/sudoku | grep -q "sudoku.js" || (echo "/sudoku page missing" && exit 1)
          curl -sf -H "Accept-Encoding: gzip" -o /dev/null -D - http://localhost:8080/words-boxed.js | grep -qi "content-encoding: gzip" || (echo "large assets not gzipped" && exit 1)

          echo "Submitting a test score with time and luck..."
          RESPONSE=$(curl -sf -X POST http://localhost:8080/api/score \
            -H "Content-Type: application/json" \
            -d '{"name":"ci-smoke-test","length":5,"date":"2020-01-01","won":true,"guesses":3,"timeMs":45000,"luck":72}')
          echo "$RESPONSE" | grep -q '"name":"ci-smoke-test"' || (echo "score submission response unexpected: $RESPONSE" && exit 1)
          echo "$RESPONSE" | grep -q '"timeMs":45000' || (echo "score submission missing timeMs: $RESPONSE" && exit 1)
          echo "$RESPONSE" | grep -q '"luck":72' || (echo "score submission missing luck: $RESPONSE" && exit 1)

          echo "Fetching leaderboard..."
          LB=$(curl -sf "http://localhost:8080/api/leaderboard?length=5")
          echo "$LB" | grep -q 'ci-smoke-test' || (echo "leaderboard missing submitted score: $LB" && exit 1)
          echo "$LB" | grep -q '"bestTimeMs":45000' || (echo "leaderboard missing bestTimeMs: $LB" && exit 1)
          echo "$LB" | grep -q '"avgLuck":72' || (echo "leaderboard missing avgLuck: $LB" && exit 1)

          echo "Spelling Bee score + leaderboard..."
          BEE=$(curl -sf -X POST http://localhost:8080/api/bee/score \
            -H "Content-Type: application/json" \
            -d '{"name":"ci-smoke-test","date":"2020-01-01","score":80,"maxScore":100,"words":30,"pangrams":1,"geniusMs":120000}')
          echo "$BEE" | grep -q '"rank":"Genius"' || (echo "bee submit unexpected: $BEE" && exit 1)
          BLB=$(curl -sf "http://localhost:8080/api/bee/leaderboard?date=2020-01-01")
          echo "$BLB" | grep -q '"geniusDays":1' || (echo "bee leaderboard unexpected: $BLB" && exit 1)

          echo "Letter Boxed score + leaderboard..."
          BOX=$(curl -sf -X POST http://localhost:8080/api/boxed/score \
            -H "Content-Type: application/json" \
            -d '{"name":"ci-smoke-test","date":"2020-01-01","words":2,"timeMs":60000,"par":5}')
          echo "$BOX" | grep -q '"words":2' || (echo "boxed submit unexpected: $BOX" && exit 1)
          XLB=$(curl -sf "http://localhost:8080/api/boxed/leaderboard?date=2020-01-01")
          echo "$XLB" | grep -q '"twoWordSolves":1' || (echo "boxed leaderboard unexpected: $XLB" && exit 1)

          echo "Connections score + leaderboard..."
          CON=$(curl -sf -X POST http://localhost:8080/api/connections/score \
            -H "Content-Type: application/json" \
            -d '{"name":"ci-smoke-test","date":"2020-01-01","solved":true,"mistakes":0,"groups":4,"timeMs":90000}')
          echo "$CON" | grep -q '"solved":true' || (echo "connections submit unexpected: $CON" && exit 1)
          CLB=$(curl -sf "http://localhost:8080/api/connections/leaderboard?date=2020-01-01")
          echo "$CLB" | grep -q '"perfect":1' || (echo "connections leaderboard unexpected: $CLB" && exit 1)

          echo "Mini, Crossword, Tiley & Sudoky scores + leaderboards..."
          MINI=$(curl -sf -X POST http://localhost:8080/api/mini/score \
            -H "Content-Type: application/json" \
            -d '{"name":"ci-smoke-test","date":"2020-01-01","hints":0,"timeMs":42000}')
          echo "$MINI" | grep -q '"hints":0' || (echo "mini submit unexpected: $MINI" && exit 1)
          CW=$(curl -sf -X POST http://localhost:8080/api/crossword/score \
            -H "Content-Type: application/json" \
            -d '{"name":"ci-smoke-test","date":"2020-01-01","hints":1,"timeMs":320000}')
          echo "$CW" | grep -q '"hints":1' || (echo "crossword submit unexpected: $CW" && exit 1)
          TIL=$(curl -sf -X POST http://localhost:8080/api/tiles/score \
            -H "Content-Type: application/json" \
            -d '{"name":"ci-smoke-test","date":"2020-01-01","bestCombo":45,"maxCombo":45,"errors":0,"timeMs":70000}')
          echo "$TIL" | grep -q '"bestCombo":45' || (echo "tiles submit unexpected: $TIL" && exit 1)
          SUD=$(curl -sf -X POST http://localhost:8080/api/sudoku/score \
            -H "Content-Type: application/json" \
            -d '{"name":"ci-smoke-test","date":"2020-01-01","difficulty":"easy","mistakes":0,"hints":0,"timeMs":95000}')
          echo "$SUD" | grep -q '"difficulty":"easy"' || (echo "sudoku submit unexpected: $SUD" && exit 1)

          echo "Rate limiting kicks in on score spam..."
          CODE=200
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/api/boxed/score \
              -H "Content-Type: application/json" -d '{"name":"ci-spam","date":"2020-01-02","words":3}')
            [ "$CODE" = "429" ] && break
          done
          [ "$CODE" = "429" ] || (echo "expected 429 after repeated writes, last code $CODE" && exit 1)

          echo "Smoke test passed"
          docker stop wordly-smoketest
          docker rm wordly-smoketest

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # main -> latest + sha; v1.2.3 tag -> 1.2.3, 1.2 and latest
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Wordly
            org.opencontainers.image.licenses=MIT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
